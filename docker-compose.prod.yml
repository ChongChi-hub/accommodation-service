x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-mail-env: &mail-env
  SMTP_HOST: ${SMTP_HOST:-${MAIL_HOST:-smtp.gmail.com}}
  SMTP_PORT: ${SMTP_PORT:-${MAIL_PORT:-587}}
  MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_FROM: ${MAIL_FROM:-no-reply@cozynestvvip.duckdns.org}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-To Am}
  MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
  MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-true}
  MAIL_ENABLED: ${MAIL_ENABLED:-true}
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
  EMAILJS_SERVICE_ID: ${EMAILJS_SERVICE_ID:-}
  EMAILJS_TEMPLATE_ID_NOTIFY: ${EMAILJS_TEMPLATE_ID_NOTIFY:-}
  EMAILJS_PUBLIC_KEY: ${EMAILJS_PUBLIC_KEY:-}
  EMAILJS_PRIVATE_KEY: ${EMAILJS_PRIVATE_KEY:-}
  EMAIL_MONTHLY_CAP: ${EMAIL_MONTHLY_CAP:-150}

x-storage-env: &storage-env
  STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-auto}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-}
  S3_PUBLIC_BUCKET: ${S3_PUBLIC_BUCKET:-cozynest-public}
  S3_PRIVATE_BUCKET: ${S3_PRIVATE_BUCKET:-cozynest-private}
  S3_PUBLIC_CDN_URL: ${S3_PUBLIC_CDN_URL:-https://cozynestvvip.duckdns.org/api/v1/media}

x-broker-env: &broker-env
  SPRING_RABBITMQ_HOST: rabbitmq
  SPRING_RABBITMQ_PORT: 5672
  SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:?RABBITMQ_USER must be set in .env}
  SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set in .env}
  COZYNEST_BROKER_ENABLED: ${COZYNEST_BROKER_ENABLED:-true}

services:
  mysql:
    image: mysql:8.4
    container_name: cozynest_mysql
    restart: unless-stopped
    mem_limit: 512m
    logging: *default-logging
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --log-bin-trust-function-creators=1
      --innodb-buffer-pool-size=192M
      --max-connections=100
      --performance-schema=OFF
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      IDENTITY_DB_USER: ${IDENTITY_DB_USER:-identity_user}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?IDENTITY_DB_PASSWORD must be set in .env}
      LISTING_DB_USER: ${LISTING_DB_USER:-listing_user}
      LISTING_DB_PASSWORD: ${LISTING_DB_PASSWORD:?LISTING_DB_PASSWORD must be set in .env}
      BOOKING_DB_USER: ${BOOKING_DB_USER:-booking_user}
      BOOKING_DB_PASSWORD: ${BOOKING_DB_PASSWORD:?BOOKING_DB_PASSWORD must be set in .env}
      BILLING_DB_USER: ${BILLING_DB_USER:-billing_user}
      BILLING_DB_PASSWORD: ${BILLING_DB_PASSWORD:?BILLING_DB_PASSWORD must be set in .env}
      COMMUNICATION_DB_USER: ${COMMUNICATION_DB_USER:-communication_user}
      COMMUNICATION_DB_PASSWORD: ${COMMUNICATION_DB_PASSWORD:?COMMUNICATION_DB_PASSWORD must be set in .env}
      ADMIN_DB_USER: ${ADMIN_DB_USER:-admin_user}
      ADMIN_DB_PASSWORD: ${ADMIN_DB_PASSWORD:?ADMIN_DB_PASSWORD must be set in .env}
      TZ: UTC
    volumes:
      - cozynest_mysql_data:/var/lib/mysql
      - ./docker/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 15s
      timeout: 5s
      retries: 6
    networks:
      - cozynest_network

  redis:
    image: redis:7-alpine
    container_name: cozynest_redis
    restart: unless-stopped
    mem_limit: 128m
    logging: *default-logging
    command: redis-server --maxmemory 96mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - cozynest_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - cozynest_network

  rabbitmq:
    image: rabbitmq:3.13-alpine
    container_name: cozynest_rabbitmq
    restart: unless-stopped
    mem_limit: 256m
    logging: *default-logging
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER must be set in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set in .env}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit vm_memory_high_watermark 0.4"
    volumes:
      - cozynest_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - cozynest_network

  api-gateway:
    image: ghcr.io/${GHCR_OWNER:-chongchi-hub}/cozynest-api-gateway:${IMAGE_TAG:-latest}
    container_name: cozynest_gateway
    restart: unless-stopped
    mem_limit: 256m
    logging: *default-logging
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      JAVA_OPTS: "-Xms64m -Xmx160m -XX:+UseSerialGC -XX:MaxMetaspaceSize=96m -XX:+TieredCompilation -XX:TieredStopAtLevel=1"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://cozynestvvip.duckdns.org,http://localhost:3000}
      IDENTITY_SERVICE_URL: http://identity-service:8081
      LISTING_SERVICE_URL: http://listing-service:8082
      BOOKING_SERVICE_URL: http://booking-service:8083
      BILLING_SERVICE_URL: http://billing-service:8084
      COMMUNICATION_SERVICE_URL: http://communication-service:8085
      ADMIN_SERVICE_URL: http://admin-service:8086
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks:
      - cozynest_network

  identity-service:
    image: ghcr.io/${GHCR_OWNER:-chongchi-hub}/cozynest-identity-service:${IMAGE_TAG:-latest}
    container_name: cozynest_identity
    restart: unless-stopped
    mem_limit: 350m
    logging: *default-logging
    environment:
      <<: [*mail-env, *storage-env, *broker-env]
      JAVA_OPTS: "-Xms96m -Xmx224m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m -XX:+TieredCompilation -XX:TieredStopAtLevel=1"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SWAGGER_ENABLED: "false"
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: cozynest_identity
      DB_USER: ${IDENTITY_DB_USER:-identity_user}
      DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?IDENTITY_DB_PASSWORD must be set in .env}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?INTERNAL_SERVICE_KEY must be set in .env}
      SPRING_DATA_REDIS_HOST: redis
      REDIS_HOST: redis
      IDENTITY_SERVICE_URL: http://identity-service:8081
      GOOGLE_LOGIN_ENABLED: ${GOOGLE_LOGIN_ENABLED:-true}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_ALLOW_STAFF: ${GOOGLE_ALLOW_STAFF:-false}
      FACE_VERIFICATION_ENABLED: ${FACE_VERIFICATION_ENABLED:-true}
      FACE_PROVIDER: ${FACE_PROVIDER:-manual}
      FACE_REQUIRED: ${FACE_REQUIRED:-true}
      FACE_ENCRYPTION_KEY: ${FACE_ENCRYPTION_KEY:?FACE_ENCRYPTION_KEY must be set in .env}
    volumes:
      - cozynest_identity_storage:/app/storage
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks:
      - cozynest_network

  listing-service:
    image: ghcr.io/${GHCR_OWNER:-chongchi-hub}/cozynest-listing-service:${IMAGE_TAG:-latest}
    container_name: cozynest_listing
    restart: unless-stopped
    mem_limit: 768m
    logging: *default-logging
    environment:
      <<: [*storage-env, *broker-env]
      JAVA_OPTS: "-Xms128m -Xmx512m -XX:+UseSerialGC -XX:MaxMetaspaceSize=192m -XX:+TieredCompilation -XX:TieredStopAtLevel=1 -XX:+ExitOnOutOfMemoryError"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SWAGGER_ENABLED: "false"
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: cozynest_listing
      DB_USER: ${LISTING_DB_USER:-listing_user}
      DB_PASSWORD: ${LISTING_DB_PASSWORD:?LISTING_DB_PASSWORD must be set in .env}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?INTERNAL_SERVICE_KEY must be set in .env}
      REDIS_HOST: redis
      IDENTITY_SERVICE_URL: http://identity-service:8081
      BOOKING_SERVICE_URL: http://booking-service:8083
    volumes:
      - cozynest_listing_storage:/app/storage
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks:
      - cozynest_network

  booking-service:
    image: ghcr.io/${GHCR_OWNER:-chongchi-hub}/cozynest-booking-service:${IMAGE_TAG:-latest}
    container_name: cozynest_booking
    restart: unless-stopped
    mem_limit: 350m
    logging: *default-logging
    environment:
      <<: [*storage-env, *broker-env]
      JAVA_OPTS: "-Xms96m -Xmx224m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m -XX:+TieredCompilation -XX:TieredStopAtLevel=1"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SWAGGER_ENABLED: "false"
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: cozynest_booking
      DB_USER: ${BOOKING_DB_USER:-booking_user}
      DB_PASSWORD: ${BOOKING_DB_PASSWORD:?BOOKING_DB_PASSWORD must be set in .env}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?INTERNAL_SERVICE_KEY must be set in .env}
      IDENTITY_SERVICE_URL: http://identity-service:8081
      LISTING_SERVICE_URL: http://listing-service:8082
      BILLING_SERVICE_URL: http://billing-service:8084
      COMMUNICATION_SERVICE_URL: http://communication-service:8085
    volumes:
      - cozynest_booking_storage:/app/storage/booking-private
    depends_on:
      mysql: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks:
      - cozynest_network

  billing-service:
    image: ghcr.io/${GHCR_OWNER:-chongchi-hub}/cozynest-billing-service:${IMAGE_TAG:-latest}
    container_name: cozynest_billing
    restart: unless-stopped
    mem_limit: 350m
    logging: *default-logging
    environment:
      <<: [*mail-env, *storage-env, *broker-env]
      JAVA_OPTS: "-Xms96m -Xmx224m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m -XX:+TieredCompilation -XX:TieredStopAtLevel=1"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SWAGGER_ENABLED: "false"
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: cozynest_billing
      DB_USER: ${BILLING_DB_USER:-billing_user}
      DB_PASSWORD: ${BILLING_DB_PASSWORD:?BILLING_DB_PASSWORD must be set in .env}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?INTERNAL_SERVICE_KEY must be set in .env}
      IDENTITY_SERVICE_URL: http://identity-service:8081
      BOOKING_SERVICE_URL: http://booking-service:8083
      COMMUNICATION_SERVICE_URL: http://communication-service:8085
      FINTECH_MODE: ${FINTECH_MODE:-LIVE}
      FINTECH_WEBHOOK_AUTO_VERIFY_ENABLED: ${FINTECH_WEBHOOK_AUTO_VERIFY_ENABLED:-false}
      FINTECH_PAYOUT_REQUIRE_OTP: ${FINTECH_PAYOUT_REQUIRE_OTP:-false}
      DEPOSIT_RELEASE_PERCENT: ${DEPOSIT_RELEASE_PERCENT:-50}
      COMMISSION_PERCENT: ${COMMISSION_PERCENT:-5}
      WITHDRAWAL_HOLD_DAYS: ${WITHDRAWAL_HOLD_DAYS:-3}
      PAYMENT_PROOF_ENCRYPTION_KEY: ${PAYMENT_PROOF_ENCRYPTION_KEY:?PAYMENT_PROOF_ENCRYPTION_KEY must be set in .env}
    volumes:
      - cozynest_billing_proofs:/app/storage/private-proofs
    depends_on:
      mysql: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks:
      - cozynest_network

  communication-service:
    image: ghcr.io/${GHCR_OWNER:-chongchi-hub}/cozynest-communication-service:${IMAGE_TAG:-latest}
    container_name: cozynest_communication
    restart: unless-stopped
    mem_limit: 300m
    logging: *default-logging
    environment:
      <<: [*mail-env, *storage-env, *broker-env]
      JAVA_OPTS: "-Xms64m -Xmx192m -XX:+UseSerialGC -XX:MaxMetaspaceSize=112m -XX:+TieredCompilation -XX:TieredStopAtLevel=1"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SWAGGER_ENABLED: "false"
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: cozynest_communication
      DB_USER: ${COMMUNICATION_DB_USER:-communication_user}
      DB_PASSWORD: ${COMMUNICATION_DB_PASSWORD:?COMMUNICATION_DB_PASSWORD must be set in .env}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?INTERNAL_SERVICE_KEY must be set in .env}
      IDENTITY_SERVICE_URL: http://identity-service:8081
    depends_on:
      mysql: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks:
      - cozynest_network

  admin-service:
    image: ghcr.io/${GHCR_OWNER:-chongchi-hub}/cozynest-admin-service:${IMAGE_TAG:-latest}
    container_name: cozynest_admin
    restart: unless-stopped
    mem_limit: 300m
    logging: *default-logging
    environment:
      <<: [*mail-env, *storage-env, *broker-env]
      JAVA_OPTS: "-Xms64m -Xmx192m -XX:+UseSerialGC -XX:MaxMetaspaceSize=112m -XX:+TieredCompilation -XX:TieredStopAtLevel=1"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SWAGGER_ENABLED: "false"
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: cozynest_admin
      DB_USER: ${ADMIN_DB_USER:-admin_user}
      DB_PASSWORD: ${ADMIN_DB_PASSWORD:?ADMIN_DB_PASSWORD must be set in .env}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?INTERNAL_SERVICE_KEY must be set in .env}
      IDENTITY_SERVICE_URL: http://identity-service:8081
      LISTING_SERVICE_URL: http://listing-service:8082
      BOOKING_SERVICE_URL: http://booking-service:8083
      BILLING_SERVICE_URL: http://billing-service:8084
    depends_on:
      mysql: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks:
      - cozynest_network

  web:
    image: ghcr.io/${GHCR_OWNER:-chongchi-hub}/cozynest-web:${IMAGE_TAG:-latest}
    container_name: cozynest_web
    restart: unless-stopped
    mem_limit: 384m
    logging: *default-logging
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=256"
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://cozynestvvip.duckdns.org}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://cozynestvvip.duckdns.org/api/v1}
      INTERNAL_API_URL: http://api-gateway:8080/api/v1
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      NEXT_PUBLIC_GOOGLE_LOGIN_ENABLED: ${GOOGLE_LOGIN_ENABLED:-true}
      NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      EMAILJS_ACC1_SERVICE_ID: ${EMAILJS_ACC1_SERVICE_ID:-}
      EMAILJS_ACC1_PUBLIC_KEY: ${EMAILJS_ACC1_PUBLIC_KEY:-}
      EMAILJS_ACC1_PRIVATE_KEY: ${EMAILJS_ACC1_PRIVATE_KEY:-}
      EMAILJS_TEMPLATE_REGISTER: ${EMAILJS_TEMPLATE_REGISTER:-}
      EMAILJS_TEMPLATE_VERIFY_EMAIL: ${EMAILJS_TEMPLATE_VERIFY_EMAIL:-}
      EMAILJS_ACC2_SERVICE_ID: ${EMAILJS_ACC2_SERVICE_ID:-}
      EMAILJS_ACC2_PUBLIC_KEY: ${EMAILJS_ACC2_PUBLIC_KEY:-}
      EMAILJS_ACC2_PRIVATE_KEY: ${EMAILJS_ACC2_PRIVATE_KEY:-}
      EMAILJS_TEMPLATE_CHANGE_PASSWORD: ${EMAILJS_TEMPLATE_CHANGE_PASSWORD:-}
    depends_on:
      - api-gateway
    networks:
      - cozynest_network

networks:
  cozynest_network:
    driver: bridge

volumes:
  cozynest_mysql_data:
  cozynest_redis_data:
  cozynest_rabbitmq_data:
  cozynest_identity_storage:
  cozynest_listing_storage:
  cozynest_booking_storage:
  cozynest_billing_proofs:

