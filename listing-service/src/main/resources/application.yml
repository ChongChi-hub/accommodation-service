server:
  port: 8082

spring:
  application:
    name: listing-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:toam_listing}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 50MB

storage:
  media-dir: ${STORAGE_MEDIA_DIR:./storage/media}

jwt:
  secret: ${JWT_SECRET:toam_super_secure_secret_key_minimum_256_bits_for_hmac_sha256_token}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /docs

