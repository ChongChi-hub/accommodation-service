server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
      routes:
        - id: identity-auth
          uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
          predicates:
            - name: Path
              args:
                patterns:
                  - /api/v1/auth/**
                  - /api/v1/users/**
                  - /api/v1/landlord/kyc/**
                  - /api/v1/moderation/kyc/**
                  - /.well-known/**

        - id: booking-service
          uri: ${BOOKING_SERVICE_URL:http://localhost:8083}
          predicates:
            - name: Path
              args:
                patterns:
                  - /api/v1/landlord/appointments/**
                  - /api/v1/tenant/appointments/**
                  - /api/v1/booking/**
                  - /api/v1/appointments/**
                  - /api/v1/rental-requests/**
                  - /api/v1/contracts/**
                  - /api/v1/maintenance/**

        - id: listing-service
          uri: ${LISTING_SERVICE_URL:http://localhost:8082}
          predicates:
            - name: Path
              args:
                patterns:
                  - /api/v1/rooms
                  - /api/v1/rooms/**
                  - /api/v1/locations/**
                  - /api/v1/amenities/**
                  - /api/v1/reviews/**
                  - /api/v1/bookmarks/**
                  - /api/v1/upload/**
                  - /uploads/**
                  - /api/v1/landlord/**
                  - /api/v1/media/**
                  - /api/v1/cms/**

        - id: billing-service
          uri: ${BILLING_SERVICE_URL:http://localhost:8084}
          predicates:
            - name: Path
              args:
                patterns:
                  - /api/v1/billing/**
                  - /api/v1/payments/**
                  - /api/v1/invoices/**

        - id: communication-service
          uri: ${COMMUNICATION_SERVICE_URL:http://localhost:8085}
          predicates:
            - name: Path
              args:
                patterns:
                  - /api/v1/communication/**
                  - /api/v1/notifications/**
                  - /api/v1/chat/**

        - id: admin-service
          uri: ${ADMIN_SERVICE_URL:http://localhost:8086}
          predicates:
            - name: Path
              args:
                patterns:
                  - /api/v1/admin-service/**
                  - /api/v1/admin/**
                  - /api/v1/reports/**
                  - /api/v1/disputes/**

management:
  endpoint:
    gateway:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,gateway

logging:
  level:
    org.springframework.cloud.gateway: DEBUG

