spring:
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins:
              - "${CORS_ALLOWED_ORIGIN:https://staging.toam.vn}"
            allow-credentials: true

management:
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    vn.cozynest: INFO

