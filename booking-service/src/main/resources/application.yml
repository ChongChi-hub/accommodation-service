server:
  port: 8083

spring:
  application:
    name: booking-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:cozynest_booking}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    encoding: UTF-8
    baseline-on-migrate: true
    locations: classpath:db/migration
    ignore-missing-migrations: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
    path: /api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /docs

jwt:
  jwks-uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}/.well-known/jwks.json
  issuer: cozynest-identity
  audience: cozynest-web
  public-key: ${JWT_PUBLIC_KEY:}

cozynest:
  broker:
    enabled: ${COZYNEST_BROKER_ENABLED:false}

app:
  identity-service:
    url: ${IDENTITY_SERVICE_URL:http://localhost:8081}
  listing-service:
    url: ${LISTING_SERVICE_URL:http://localhost:8082}
  internal:
    service-key: ${INTERNAL_SERVICE_KEY:CozyNestInternalServiceKeySecret2026}
  booking:
    identity:
      allow-sandbox-bypass: ${APP_BOOKING_IDENTITY_ALLOW_SANDBOX_BYPASS:true}
