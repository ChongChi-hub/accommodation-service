spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:cozynest_booking}?useSSL=true&requireSSL=true&serverTimezone=UTC&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
    username: ${BOOKING_DB_USER}
    password: ${BOOKING_DB_PASS}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration

fintech:
  mode: ${FINTECH_MODE:SANDBOX_ONLY}
  escrow:
    live-custody-enabled: ${FINTECH_LIVE_CUSTODY_ENABLED:false}
  disbursement:
    live-enabled: ${FINTECH_LIVE_DISBURSEMENT_ENABLED:false}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

