spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:cozynest_billing}?useSSL=true&requireSSL=true&serverTimezone=UTC&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
    username: ${BILLING_DB_USER}
    password: ${BILLING_DB_PASS}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration

# LEGAL-02 Human Gate: keep live custody & disbursement disabled until legal/partner sign-off.
fintech:
  mode: SANDBOX_ONLY
  escrow:
    live-custody-enabled: false
  disbursement:
    live-enabled: false
  gateway:
    kill-switch: ${PAYMENT_GATEWAY_KILL_SWITCH:false}
    webhook-strict-ip-allowlist: true
    webhook-allowed-ips: ${PAYMENT_WEBHOOK_ALLOWED_IPS}
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoint:
    health:
      show-details: never

