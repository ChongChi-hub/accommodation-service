spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:cozynest_billing}?useSSL=true&requireSSL=true&serverTimezone=UTC&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
    username: ${BILLING_DB_USER}
    password: ${BILLING_DB_PASS}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:${RABBITMQ_HOST:rabbitmq}}
    port: ${SPRING_RABBITMQ_PORT:${RABBITMQ_PORT:5672}}
    username: ${SPRING_RABBITMQ_USERNAME:${RABBITMQ_USER:cozynest}}
    password: ${SPRING_RABBITMQ_PASSWORD:${RABBITMQ_PASSWORD}}

cozynest:
  broker:
    enabled: ${COZYNEST_BROKER_ENABLED:true}

# LEGAL-02 Human Gate: keep live custody & disbursement disabled until legal/partner sign-off.
fintech:
  mode: SANDBOX_ONLY
  escrow:
    live-custody-enabled: false
  disbursement:
    live-enabled: false
  gateway:
    kill-switch: ${PAYMENT_GATEWAY_KILL_SWITCH:false}
    webhook-strict-ip-allowlist: true
    webhook-allowed-ips: ${PAYMENT_WEBHOOK_ALLOWED_IPS}
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
