spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:cozynest_billing}?useSSL=true&requireSSL=true&serverTimezone=UTC&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
    username: ${BILLING_DB_USER}
    password: ${BILLING_DB_PASS}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration

fintech:
  mode: ${FINTECH_MODE:SANDBOX_ONLY}
  escrow:
    live-custody-enabled: ${FINTECH_LIVE_CUSTODY_ENABLED:false}
  disbursement:
    live-enabled: ${FINTECH_LIVE_DISBURSEMENT_ENABLED:false}
  gateway:
    kill-switch: ${PAYMENT_GATEWAY_KILL_SWITCH:false}
    webhook-strict-ip-allowlist: true
    webhook-allowed-ips: ${PAYMENT_WEBHOOK_ALLOWED_IPS:127.0.0.1}
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

