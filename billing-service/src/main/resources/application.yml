server:
  port: 8084

spring:
  application:
    name: billing-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:cozynest_billing}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    encoding: UTF-8
    baseline-on-migrate: true
    locations: classpath:db/migration
    ignore-missing-migrations: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
    path: /api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /docs

jwt:
  jwks-uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}/.well-known/jwks.json
  issuer: cozynest-identity
  audience: cozynest-web
  public-key: ${JWT_PUBLIC_KEY:}

cozynest:
  broker:
    enabled: ${COZYNEST_BROKER_ENABLED:false}

fintech:
  mode: ${FINTECH_MODE:SANDBOX_ONLY}
  platform:
    bank-code: ${FINTECH_PLATFORM_BANK_CODE:VCB}
    bank-bin: ${FINTECH_PLATFORM_BANK_BIN:970436}
    account-number: ${FINTECH_PLATFORM_ACCOUNT_NUMBER:1042701900}
    account-holder: ${FINTECH_PLATFORM_ACCOUNT_HOLDER:LE THANH CUONG}
  webhook:
    provider: ${FINTECH_WEBHOOK_PROVIDER:FAKE}
    window-seconds: ${FINTECH_WEBHOOK_WINDOW_SECONDS:300}
  commission:
    percent: ${COMMISSION_PERCENT:5}
  deposit:
    release-percent: ${DEPOSIT_RELEASE_PERCENT:50}
  withdrawal:
    hold-days: ${WITHDRAWAL_HOLD_DAYS:0}
    min-amount: ${WITHDRAWAL_MIN_AMOUNT:1000}
  payout:
    maker-checker-threshold-vnd: ${PAYOUT_MAKER_CHECKER_THRESHOLD_VND:10000000}
  payment:
    manual-maker-checker-threshold-vnd: ${MANUAL_PAYMENT_MAKER_CHECKER_THRESHOLD_VND:10000000}
  proof:
    storage-dir: ${FINTECH_PROOF_STORAGE_DIR:./storage/private-proofs}
    encryption-key: ${FINTECH_PROOF_ENCRYPTION_KEY:cozynest-private-proof-aes256-key-2026}
  gateway:
    qr-base-url: ${FINTECH_GATEWAY_QR_BASE_URL:https://img.vietqr.io/image}
    bank-bin: ${FINTECH_GATEWAY_BANK_BIN:970436}
    virtual-account: ${FINTECH_GATEWAY_VIRTUAL_ACCOUNT:1042701900}
    account-name: ${FINTECH_GATEWAY_ACCOUNT_NAME:LE THANH CUONG}
    kill-switch: ${FINTECH_GATEWAY_KILL_SWITCH:false}
    webhook-secret: ${FINTECH_GATEWAY_WEBHOOK_SECRET:cozynest-dev-fake-webhook-secret-2026}

app:
  identity-service:
    url: ${IDENTITY_SERVICE_URL:http://localhost:8081}
  booking-service:
    url: ${BOOKING_SERVICE_URL:http://localhost:8083}
  billing:
    identity:
      allow-sandbox-bypass: ${BILLING_IDENTITY_ALLOW_SANDBOX_BYPASS:false}
  internal:
    service-key: ${INTERNAL_SERVICE_KEY:CozyNestInternalServiceKeySecret2026}

