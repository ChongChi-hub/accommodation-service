name: CI Security & Test Gate

on:
  push:
    branches: [ main, develop, feat/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '23'
      - name: Run All Backend Unit & Architecture Tests
        run: ./gradlew clean test --no-daemon --console=plain
      - name: Secret Hygiene Scan
        run: |
          if grep -rnE "sk_live_|AKIA[0-9A-Z]{16}|-----BEGIN RSA PRIVATE KEY-----" --exclude-dir=test --exclude-dir=.git --exclude-dir=.github .; then
            echo "Potential secret leaked in non-test source!"
            exit 1
          fi

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'CozyNest Accommodation Service'
          path: '.'
          format: 'HTML'
          args: >
            --enableRetired
        continue-on-error: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Identity Docker Image for Scanning
        run: |
          docker compose build identity-service

      - name: Run Trivy Vulnerability Scan on Docker Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'accommodation-service-identity-service:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

