name: CI Security & Test Gate

on:
  push:
    branches: [ main, develop, feat/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '23'
      - name: Run All Backend Unit & Architecture Tests
        run: ./gradlew clean test --no-daemon --console=plain
      - name: Secret Hygiene Scan
        run: |
          if grep -rnE "sk_live_|AKIA[0-9A-Z]{16}|-----BEGIN RSA PRIVATE KEY-----" --exclude-dir=test --exclude-dir=.git --exclude-dir=.github .; then
            echo "Potential secret leaked in non-test source!"
            exit 1
          fi

