# Nginx Reverse Proxy for CozyNest / To Am (https://cozynestvvip.duckdns.org)
# Install on Ubuntu VPS:
#   sudo cp /opt/cozynest/nginx/cozynestvvip.conf /etc/nginx/sites-available/cozynestvvip.conf
#   sudo ln -sf /etc/nginx/sites-available/cozynestvvip.conf /etc/nginx/sites-enabled/cozynestvvip.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d cozynestvvip.duckdns.org

upstream cozynest_web_upstream {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream cozynest_gateway_upstream {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name cozynestvvip.duckdns.org;

    # Allow room photos, eKYC scans, and bank transfer receipts up to 25MB
    client_max_body_size 25M;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Direct Backend API Gateway routes (JWKS, uploaded media, external payment webhooks)
    location /.well-known/jwks.json {
        proxy_pass http://cozynest_gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://cozynest_gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_valid 200 1h;
    }

    location /api/v1/billing/webhooks/ {
        proxy_pass http://cozynest_gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional direct API Gateway pass-through for external API clients (/gateway/api/v1/...)
    location /gateway/ {
        rewrite ^/gateway/(.*)$ /$1 break;
        proxy_pass http://cozynest_gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Next.js Frontend + BFF API routes (/api/auth/*, /api/v1/* cookie-to-Bearer proxy, /api/geocode, /api/upload/*)
    location / {
        proxy_pass http://cozynest_web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}

