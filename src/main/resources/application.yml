server:
  port: ${PORT:8080}

spring:
  application:
    name: phongtro-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:room_rental}?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false

jwt:
  secret: ${JWT_SECRET:phongtro_super_secret_key_change_in_production_2024}
  expiration-ms: 604800000        # 7 days
  refresh-expiration-ms: 2592000000 # 30 days

cors:
  allowed-origins: ${CORS_ORIGIN:http://localhost:5173}
