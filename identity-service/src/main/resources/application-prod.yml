spring:
  flyway:
    locations: classpath:db/migration

app:
  kyc:
    cleanup-enabled: ${KYC_CLEANUP_ENABLED:true}

face:
  cleanup:
    enabled: ${FACE_CLEANUP_ENABLED:true}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health

