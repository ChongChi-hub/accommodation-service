spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:cozynest_identity}?useSSL=true&requireSSL=true&serverTimezone=UTC&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
    username: ${IDENTITY_DB_USER}
    password: ${IDENTITY_DB_PASS}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration

app:
  internal:
    service-key: ${INTERNAL_SERVICE_KEY}
  kyc:
    cleanup-enabled: ${KYC_CLEANUP_ENABLED:true}

face:
  cleanup:
    enabled: ${FACE_CLEANUP_ENABLED:true}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
