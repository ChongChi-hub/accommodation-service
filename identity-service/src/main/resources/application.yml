server:
  port: 8081

spring:
  application:
    name: identity-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:cozynest_identity}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  flyway:
    enabled: true
    encoding: UTF-8
    baseline-on-migrate: true
    locations: classpath:db/migration
    ignore-missing-migrations: true

jwt:
  secret: ${JWT_SECRET:cozynest_super_secure_secret_key_minimum_256_bits_for_hmac_sha256_token}
  expiration-ms: 900000          # 15 minutes
  refresh-expiration-ms: 2592000000 # 30 days

google:
  enabled: ${GOOGLE_LOGIN_ENABLED:false}
  client-id: ${GOOGLE_CLIENT_ID:}
  jwks-uri: ${GOOGLE_JWKS_URI:https://www.googleapis.com/oauth2/v3/certs}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /docs

face:
  verification-enabled: ${FACE_VERIFICATION_ENABLED:true}
  provider: ${FACE_PROVIDER:manual}
  required: ${FACE_REQUIRED:true}
  retention-days: ${FACE_RETENTION_DAYS:30}
  max-attempts-per-day: ${FACE_MAX_ATTEMPTS_PER_DAY:3}
  cleanup:
    enabled: ${FACE_CLEANUP_ENABLED:false}
    cron: "0 0 3 * * ?"
  storage:
    directory: ${FACE_STORAGE_DIRECTORY:./storage/face_private}
  encryption-key: ${FACE_ENCRYPTION_KEY:}
  vendor:
    base-url: ${FACE_VENDOR_BASE_URL:}
    api-key: ${FACE_VENDOR_API_KEY:}

management:
  health:
    mail:
      enabled: false

