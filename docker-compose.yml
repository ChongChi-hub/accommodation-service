version: '3.8'

services:
  mysql:
    image: mysql:9.1
    container_name: cozynest_mysql
    restart: always
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpassword123}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${DB_PORT:-5555}:3306"
    volumes:
      - cozynest_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cozynest_network

  redis:
    image: redis:7-alpine
    container_name: cozynest_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - cozynest_redis_data:/data
    networks:
      - cozynest_network

  mailpit:
    image: axllent/mailpit:latest
    container_name: cozynest_mailpit
    restart: always
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    networks:
      - cozynest_network

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: cozynest_gateway
    restart: always
    ports:
      - "8080:8080"
    environment:
      IDENTITY_SERVICE_URL: http://identity-service:8081
      LISTING_SERVICE_URL: http://listing-service:8082
      BOOKING_SERVICE_URL: http://booking-service:8083
      BILLING_SERVICE_URL: http://billing-service:8084
      COMMUNICATION_SERVICE_URL: http://communication-service:8085
      ADMIN_SERVICE_URL: http://admin-service:8086
    depends_on:
      - mysql
      - redis
    networks:
      - cozynest_network

  identity-service:
    build:
      context: .
      dockerfile: identity-service/Dockerfile
    container_name: cozynest_identity
    restart: always
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: cozynest_identity
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-rootpassword123}
      JWT_SECRET: ${JWT_SECRET:-cozynest_super_secure_secret_key_minimum_256_bits_for_hmac_sha256_token}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - cozynest_network

  listing-service:
    build:
      context: .
      dockerfile: listing-service/Dockerfile
    container_name: cozynest_listing
    restart: always
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: cozynest_listing
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-rootpassword123}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - cozynest_network

  booking-service:
    build:
      context: .
      dockerfile: booking-service/Dockerfile
    container_name: cozynest_booking
    restart: always
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: cozynest_booking
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-rootpassword123}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - cozynest_network

  billing-service:
    build:
      context: .
      dockerfile: billing-service/Dockerfile
    container_name: cozynest_billing
    restart: always
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: cozynest_billing
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-rootpassword123}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - cozynest_network

  communication-service:
    build:
      context: .
      dockerfile: communication-service/Dockerfile
    container_name: cozynest_communication
    restart: always
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: cozynest_communication
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-rootpassword123}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - cozynest_network

  admin-service:
    build:
      context: .
      dockerfile: admin-service/Dockerfile
    container_name: cozynest_admin
    restart: always
    ports:
      - "8086:8086"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: cozynest_admin
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-rootpassword123}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - cozynest_network

  web:
    build:
      context: ../accommodation-web
      dockerfile: Dockerfile
    container_name: cozynest_web
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
    depends_on:
      - api-gateway
    networks:
      - cozynest_network
    profiles:
      - full

networks:
  cozynest_network:
    driver: bridge

volumes:
  cozynest_mysql_data:
  cozynest_redis_data:
