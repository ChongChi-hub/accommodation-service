services:
  mysql:
    image: mysql:8.4
    container_name: cozynest_mysql
    restart: always
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --log-bin-trust-function-creators=1
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      IDENTITY_DB_USER: ${IDENTITY_DB_USER:-identity_user}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?IDENTITY_DB_PASSWORD must be set in .env}
      LISTING_DB_USER: ${LISTING_DB_USER:-listing_user}
      LISTING_DB_PASSWORD: ${LISTING_DB_PASSWORD:?LISTING_DB_PASSWORD must be set in .env}
      BOOKING_DB_USER: ${BOOKING_DB_USER:-booking_user}
      BOOKING_DB_PASSWORD: ${BOOKING_DB_PASSWORD:?BOOKING_DB_PASSWORD must be set in .env}
      BILLING_DB_USER: ${BILLING_DB_USER:-billing_user}
      BILLING_DB_PASSWORD: ${BILLING_DB_PASSWORD:?BILLING_DB_PASSWORD must be set in .env}
      COMMUNICATION_DB_USER: ${COMMUNICATION_DB_USER:-communication_user}
      COMMUNICATION_DB_PASSWORD: ${COMMUNICATION_DB_PASSWORD:?COMMUNICATION_DB_PASSWORD must be set in .env}
      ADMIN_DB_USER: ${ADMIN_DB_USER:-admin_user}
      ADMIN_DB_PASSWORD: ${ADMIN_DB_PASSWORD:?ADMIN_DB_PASSWORD must be set in .env}
      TZ: UTC
    ports:
      - "${DB_PORT:-5555}:3306"
    volumes:
      - cozynest_mysql_data:/var/lib/mysql
      - ./docker/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cozynest_network
    profiles:
      - infra
      - core
      - full

  redis:
    image: redis:7-alpine
    container_name: cozynest_redis
    restart: always
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - cozynest_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cozynest_network
    profiles:
      - infra
      - core
      - full

  mailpit:
    image: axllent/mailpit:latest
    container_name: cozynest_mailpit
    restart: always
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    networks:
      - cozynest_network
    profiles:
      - infra
      - core
      - full

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: cozynest_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER must be set in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set in .env}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - cozynest_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cozynest_network
    profiles:
      - infra
      - core
      - full

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: cozynest_gateway
    restart: always
    ports:
      - "8080:8080"
    environment:
      IDENTITY_SERVICE_URL: http://identity-service:8081
      LISTING_SERVICE_URL: http://listing-service:8082
      BOOKING_SERVICE_URL: http://booking-service:8083
      BILLING_SERVICE_URL: http://billing-service:8084
      COMMUNICATION_SERVICE_URL: http://communication-service:8085
      ADMIN_SERVICE_URL: http://admin-service:8086
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - cozynest_network
    profiles:
      - core
      - full

  identity-service:
    build:
      context: .
      dockerfile: identity-service/Dockerfile
    container_name: cozynest_identity
    restart: always
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: cozynest_identity
      DB_USER: ${IDENTITY_DB_USER:-identity_user}
      DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?IDENTITY_DB_PASSWORD must be set in .env}
      GOOGLE_LOGIN_ENABLED: ${GOOGLE_LOGIN_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      REDIS_HOST: redis
      IDENTITY_SERVICE_URL: http://identity-service:8081
      REDIS_PORT: 6379
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@cozynest.vn}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Tổ Ấm}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
      MAIL_ENABLED: ${MAIL_ENABLED:-true}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cozynest_network
    profiles:
      - core
      - full

  listing-service:
    build:
      context: .
      dockerfile: listing-service/Dockerfile
    container_name: cozynest_listing
    restart: always
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: cozynest_listing
      DB_USER: ${LISTING_DB_USER:-listing_user}
      DB_PASSWORD: ${LISTING_DB_PASSWORD:?LISTING_DB_PASSWORD must be set in .env}
      REDIS_HOST: redis
      IDENTITY_SERVICE_URL: http://identity-service:8081
      BOOKING_SERVICE_URL: http://booking-service:8083
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cozynest_network
    profiles:
      - core
      - full

  booking-service:
    build:
      context: .
      dockerfile: booking-service/Dockerfile
    container_name: cozynest_booking
    restart: always
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: cozynest_booking
      DB_USER: ${BOOKING_DB_USER:-booking_user}
      DB_PASSWORD: ${BOOKING_DB_PASSWORD:?BOOKING_DB_PASSWORD must be set in .env}
      IDENTITY_SERVICE_URL: http://identity-service:8081
      COMMUNICATION_SERVICE_URL: http://communication-service:8085
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:?RABBITMQ_USER must be set in .env}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set in .env}
      COZYNEST_BROKER_ENABLED: ${COZYNEST_BROKER_ENABLED:-true}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - cozynest_network
    profiles:
      - core
      - full

  billing-service:
    build:
      context: .
      dockerfile: billing-service/Dockerfile
    container_name: cozynest_billing
    restart: always
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: cozynest_billing
      DB_USER: ${BILLING_DB_USER:-billing_user}
      DB_PASSWORD: ${BILLING_DB_PASSWORD:?BILLING_DB_PASSWORD must be set in .env}
      IDENTITY_SERVICE_URL: http://identity-service:8081
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:?RABBITMQ_USER must be set in .env}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set in .env}
      COZYNEST_BROKER_ENABLED: ${COZYNEST_BROKER_ENABLED:-true}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - cozynest_network
    profiles:
      - full

  communication-service:
    build:
      context: .
      dockerfile: communication-service/Dockerfile
    container_name: cozynest_communication
    restart: always
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: cozynest_communication
      DB_USER: ${COMMUNICATION_DB_USER:-communication_user}
      DB_PASSWORD: ${COMMUNICATION_DB_PASSWORD:?COMMUNICATION_DB_PASSWORD must be set in .env}
      IDENTITY_SERVICE_URL: http://identity-service:8081
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:?RABBITMQ_USER must be set in .env}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set in .env}
      COZYNEST_BROKER_ENABLED: ${COZYNEST_BROKER_ENABLED:-true}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - cozynest_network
    profiles:
      - full

  admin-service:
    build:
      context: .
      dockerfile: admin-service/Dockerfile
    container_name: cozynest_admin
    restart: always
    ports:
      - "8086:8086"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: cozynest_admin
      DB_USER: ${ADMIN_DB_USER:-admin_user}
      DB_PASSWORD: ${ADMIN_DB_PASSWORD:?ADMIN_DB_PASSWORD must be set in .env}
      IDENTITY_SERVICE_URL: http://identity-service:8081
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:?RABBITMQ_USER must be set in .env}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set in .env}
      COZYNEST_BROKER_ENABLED: ${COZYNEST_BROKER_ENABLED:-true}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - cozynest_network
    profiles:
      - full

  web:
    build:
      context: ../accommodation-web
      dockerfile: Dockerfile
    container_name: cozynest_web
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
      INTERNAL_API_URL: http://api-gateway:8080/api/v1
    depends_on:
      - api-gateway
    networks:
      - cozynest_network
    profiles:
      - full

networks:
  cozynest_network:
    driver: bridge

volumes:
  cozynest_mysql_data:
  cozynest_redis_data:
  cozynest_rabbitmq_data:
