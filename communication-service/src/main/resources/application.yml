server:
  port: 8085
  tomcat:
    threads:
      max: 30

spring:
  application:
    name: communication-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:cozynest_communication}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    encoding: UTF-8
    baseline-on-migrate: true
    locations: classpath:db/migration
    ignore-missing-migrations: true
  mail:
    host: ${SMTP_HOST:${MAIL_HOST:mailpit}}
    port: ${MAIL_PORT:${SMTP_PORT:1025}}
    username: ${MAIL_USERNAME:${SMTP_USER:}}
    password: ${MAIL_PASSWORD:${SMTP_PASSWORD:}}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

mail:
  enabled: ${MAIL_ENABLED:true}
  provider: ${EMAIL_PROVIDER:smtp}
  from: ${MAIL_FROM:no-reply@cozynest.vn}
  from-name: ${MAIL_FROM_NAME:Tổ Ấm}
  monthly-cap: ${EMAIL_MONTHLY_CAP:150}
  redirect-to: ${MAIL_REDIRECT_TO:}
  emailjs:
    endpoint: ${EMAILJS_ENDPOINT:https://api.emailjs.com/api/v1.0/email/send}
    service-id: ${EMAILJS_SERVICE_ID:}
    template-id-notify: ${EMAILJS_TEMPLATE_ID_NOTIFY:}
    public-key: ${EMAILJS_PUBLIC_KEY:}
    private-key: ${EMAILJS_PRIVATE_KEY:}

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
    path: /api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /docs

jwt:
  jwks-uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}/.well-known/jwks.json
  issuer: cozynest-identity
  audience: cozynest-web
  public-key: ${JWT_PUBLIC_KEY:}

cozynest:
  broker:
    enabled: ${COZYNEST_BROKER_ENABLED:false}

app:
  internal:
    service-key: ${INTERNAL_SERVICE_KEY:CozyNestInternalServiceKeySecret2026}

spring.rabbitmq.listener.simple.auto-startup: ${COZYNEST_BROKER_ENABLED:false}
spring.rabbitmq.listener.simple.default-requeue-rejected: false
