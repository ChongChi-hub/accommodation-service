pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'accommodation-service'

// Active Microservices & Shared Libraries
include 'common'
include 'api-gateway'
include 'identity-service'
include 'listing-service'
include 'booking-service'
include 'billing-service'
include 'communication-service'
include 'admin-service'

